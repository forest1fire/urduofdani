name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Windows installer (.exe)
        env:
          # Tell electron-builder where Python is, so the sidecar can be located.
          UD_PYTHON: python
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-Setup-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-linux:
    name: Build Linux AppImage + .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-linux
          path: |
            release/*.AppImage
            release/*.deb