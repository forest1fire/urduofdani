name: release

# Trigger:
#   - Push a tag matching v* (e.g. v1.0.0, v1.2.0-rc.1)
#   - Manual dispatch from the Actions tab (lets us dry-run the pipeline)
#
# Produces:
#   - Windows NSIS installer (.exe)         uploaded as UrduOfDani-Setup-windows
#   - Linux AppImage + .deb                 uploaded as UrduOfDani-linux
#   - macOS DMG (only on macos-latest)      uploaded as UrduOfDani-mac
#   - GitHub Release draft on tag push, with the installers attached
#
# Created by Muhammad Danish [Dani] · DaniLabs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no GitHub Release publish, just build)'
        required: false
        default: 'true'

permissions:
  contents: write  # needed for softprops/action-gh-release to attach artifacts

jobs:
  build-windows:
    name: 🪟 Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Windows installer
        env:
          UD_PYTHON: python
          # When CODE_SIGNING_CERT (base64) + WIN_CSC_KEY_PASSWORD are present
          # electron-builder will sign the .exe automatically. Both are optional.
          CSC_LINK: ${{ secrets.CODE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-Setup-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-linux:
    name: 🐧 Linux AppImage + .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build renderer
        run: npm run build
      - name: Package Linux installers
        run: npm run dist:linux
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  build-mac:
    name: 🍎 macOS .dmg
    # Cross-compiling macOS on Linux/Windows is not supported by electron-builder.
    # This job only runs on a self-hosted macOS runner labelled "macos" or
    # when manually dispatched by a maintainer. See README "Cutting a release".
    runs-on: ${{ github.event.inputs.runner_os == 'macos' && fromJSON('["self-hosted","macos"]') || 'macos-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-mac
          path: |
            release/*.dmg
            release/latest-mac.yml

  publish-release:
    name: 📦 Publish GitHub Release
    needs: [build-windows, build-linux, build-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/UrduOfDani-Setup-windows/*.exe
            artifacts/UrduOfDani-linux/*.AppImage
            artifacts/UrduOfDani-linux/*.deb
            artifacts/UrduOfDani-mac/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
