name: release

# Trigger:
#   - Push a tag matching v* (e.g. v1.0.0, v1.2.0-rc.1)
#   - Manual dispatch from the Actions tab (lets us dry-run the pipeline)
#
# Produces:
#   - Windows NSIS installer (.exe)         uploaded as UrduOfDani-Setup-windows
#   - Linux AppImage + .deb                 uploaded as UrduOfDani-linux
#   - macOS DMG (only on macos-latest)      uploaded as UrduOfDani-mac
#   - GitHub Release draft on tag push, with the installers attached
#
# Created by Muhammad Danish [Dani] · DaniLabs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no GitHub Release publish, just build)'
        required: false
        default: 'true'
      runner_os:
        description: 'OS to build on (for the macOS job; usually macos-latest)'
        required: false
        default: 'macos-latest'

permissions:
  contents: write  # needed for softprops/action-gh-release to attach artifacts

jobs:
  # --- pre-flight ---------------------------------------------------------
  preflight:
    name: 🩺 Pre-flight (audit + tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm test

  build-windows:
    name: 🪟 Windows .exe
    needs: [preflight]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build renderer
        run: npm run build
      - name: Package Windows installer
        env:
          UD_PYTHON: python
          # When CODE_SIGNING_CERT (base64) + WIN_CSC_KEY_PASSWORD are present
          # electron-builder will sign the .exe automatically. Both are optional.
          CSC_LINK: ${{ secrets.CODE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-Setup-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-linux:
    name: 🐧 Linux AppImage + .deb
    needs: [preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot rpm
      - name: Package Linux installers
        env:
          UD_PYTHON: python3
        run: npm run dist:linux
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  build-mac:
    name: 🍎 macOS .dmg
    # Cross-compiling macOS on Linux/Windows is not supported by electron-builder.
    # This job only runs on a self-hosted macOS runner labelled "macos" or
    # when manually dispatched by a maintainer. See README "Cutting a release".
    needs: [preflight]
    runs-on: ${{ github.event.inputs.runner_os == 'self-hosted' && fromJSON('["self-hosted","macos"]') || 'macos-latest' }}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Package macOS DMG
        env:
          UD_PYTHON: python3
          # Code signing for macOS, if a Developer ID is configured.
          CSC_LINK: ${{ secrets.MAC_CODE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: npm run dist:mac
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: UrduOfDani-mac
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: ignore

  publish-release:
    name: 📦 Publish GitHub Release
    needs: [build-windows, build-linux, build-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -maxdepth 3 -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
