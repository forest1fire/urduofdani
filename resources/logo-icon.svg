<?xml version="1.0" encoding="UTF-8"?>
<!-- UrduOfDani — square app icon.
     Single, coherent emerald pen with Urdu calligraphy.
     Drawn as a vertical pen, then rotated as one group. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B89A"/>
      <stop offset="1" stop-color="#008F76"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <!-- Rounded emerald plate -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#plate)"/>

  <!-- Whole pen drawn vertically, then rotated -30° about its centre. -->
  <g transform="translate(256 256) rotate(-30) translate(-110 -270)">
    <!-- Feathered tail (bottom of the pen, drawn here at y≈350-470) -->
    <path d="M 70 470
             C 80 410, 110 360, 150 340
             L 180 360
             C 160 400, 130 460, 100 490
             Z"
          fill="#0E7A65" stroke="#0a5d4d" stroke-width="3" stroke-linejoin="round"/>

    <!-- Pen barrel (vertical: top y=110, bottom y=380, width 60) -->
    <rect x="80" y="120" width="60" height="260" rx="8" fill="#102A43"/>
    <!-- Barrel band 1 (top, navy highlight) -->
    <rect x="80" y="120" width="60" height="14" fill="#1E3A5F" rx="2"/>
    <!-- Barrel band 2 (bottom, navy highlight) -->
    <rect x="80" y="368" width="60" height="12" fill="#1E3A5F" rx="2"/>

    <!-- Nib (pointed top: starts at y=110, comes to a point at y=10) -->
    <path d="M 80 130
             L 110 10
             L 140 130
             Z"
          fill="url(#nib)"/>
    <!-- Nib slit + dot -->
    <line x1="110" y1="20" x2="110" y2="110" stroke="#14B89A" stroke-width="3"/>
    <circle cx="110" cy="65" r="6" fill="#14B89A"/>

    <!-- Urdu calligraphy on the barrel -->
    <text x="110" y="290" text-anchor="middle"
          font-family="'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif"
          font-size="80" fill="#14B89A" font-weight="700">داني</text>

    <!-- Decorative bar below the calligraphy -->
    <line x1="92" y1="320" x2="128" y2="320" stroke="#14B89A" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
