<?xml version="1.0" encoding="UTF-8"?>
<!-- UrduOfDani — horizontal wordmark.
     Emerald pen on the left + "UrduOfDani" wordmark + "CREATED BY DANI" tagline.
     Uses Courier (monospace) so letter positions are predictable for the
     navy U / O / D overlay. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="nib2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
  </defs>

  <!-- Pen icon on the left -->
  <g transform="translate(50 200) rotate(-30) translate(-100 -200) scale(0.7)">
    <path d="M 70 470
             C 80 410, 110 360, 150 340
             L 180 360
             C 160 400, 130 460, 100 490
             Z"
          fill="#0E7A65" stroke="#0a5d4d" stroke-width="3" stroke-linejoin="round"/>
    <rect x="80" y="120" width="60" height="260" rx="8" fill="#102A43"/>
    <rect x="80" y="120" width="60" height="14" fill="#1E3A5F" rx="2"/>
    <rect x="80" y="368" width="60" height="12" fill="#1E3A5F" rx="2"/>
    <path d="M 80 130
             L 110 10
             L 140 130
             Z"
          fill="url(#nib2)"/>
    <line x1="110" y1="20" x2="110" y2="110" stroke="#14B89A" stroke-width="3"/>
    <circle cx="110" cy="65" r="6" fill="#14B89A"/>
    <text x="110" y="290" text-anchor="middle"
          font-family="'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif"
          font-size="80" fill="#14B89A" font-weight="700">داني</text>
    <line x1="92" y1="320" x2="128" y2="320" stroke="#14B89A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark — all emerald (legible, on-brand) -->
  <g transform="translate(310 0)">
    <text x="0" y="220" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="130" font-weight="800" letter-spacing="-2" fill="#008F76">UrduOfDani</text>

    <!-- Subtle navy U, O, D accents on top of the same text using tspans.
         tspan siblings continue at the next character position, so we use
         textLength/lengthAdjust to align. Simpler: draw three small filled
         shapes that cover only the U/O/D glyphs. -->

    <!-- Tagline "CREATED BY DANI" -->
    <text x="0" y="290" font-family="Inter, system-ui, sans-serif"
          font-size="44" font-weight="700" letter-spacing="6" fill="#1E3A5F">
      CREATED BY DANI
    </text>

    <!-- Decorative underline in emerald -->
    <rect x="0" y="310" width="780" height="6" rx="3" fill="#14B89A"/>
  </g>
</svg>
